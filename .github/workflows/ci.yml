name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # Self-hosted, because the project needs an Xcode the GitHub-hosted macOS images do not carry.
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up rbenv
        run: |
          export PATH="$HOME/.rbenv/bin:$PATH"
          eval "$(rbenv init -)"
          echo "PATH=$HOME/.rbenv/shims:$HOME/.rbenv/bin:$PATH" >> $GITHUB_ENV
      - name: Install gems
        run: bundle install
      - name: Build and test
        run: bundle exec fastlane test

  lint:
    name: SwiftLint
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # SwiftLint is already installed on the runner, so this only repairs the PATH: a runner
      # started by launchd does not always inherit Homebrew's bin directory.
      # --lenient keeps warnings advisory until the existing ones are burned down. Drop it to
      # make a warning fail the job.
      - name: Lint
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          fi
          swiftlint lint --lenient --reporter github-actions-logging
